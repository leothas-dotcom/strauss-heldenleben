<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6CB7E"/>
      <stop offset="0.5" stop-color="#B08A3A"/>
      <stop offset="1" stop-color="#D8B765"/>
    </linearGradient>
    <linearGradient id="g-held" x1="0" x2="1"><stop offset="0" stop-color="#143E66"/><stop offset="1" stop-color="#E8DCC6"/></linearGradient>
    <linearGradient id="g-gef" x1="0" x2="1"><stop offset="0" stop-color="#D9774F"/><stop offset="0.35" stop-color="#5A4A6A"/><stop offset="0.55" stop-color="#143E66"/><stop offset="1" stop-color="#0D2742"/></linearGradient>
    <linearGradient id="g-wal" x1="0" x2="1"><stop offset="0" stop-color="#1F1A18"/><stop offset="0.5" stop-color="#7A2410"/><stop offset="1" stop-color="#1F1A18"/></linearGradient>
    <linearGradient id="g-rep" x1="0" x2="1"><stop offset="0" stop-color="#E8DCC6"/><stop offset="1" stop-color="#A9BCCC"/></linearGradient>
    <linearGradient id="g-fri" x1="0" x2="1"><stop offset="0" stop-color="#E2BC8A"/><stop offset="1" stop-color="#76657D"/></linearGradient>
    <linearGradient id="g-wel" x1="0" x2="1"><stop offset="0" stop-color="#E07A4F"/><stop offset="0.6" stop-color="#2E4C70"/><stop offset="1" stop-color="#143E66"/></linearGradient>
  </defs>

  <rect width="1200" height="640" fill="#E8DCC6"/>
  <text x="40" y="42" font-size="24" fill="#1F1A18">Elävä vedos – paletti ja väripartituuri</text>

  <!-- Painolaatat -->
  <text x="40" y="72" font-size="13" fill="#1F1A18">Painolaatat – mitattu LP-kannesta (London LL 659)</text>
  <g font-size="12" fill="#1F1A18">
    <rect x="40" y="82" width="140" height="90" fill="#E8DCC6" stroke="#1F1A18" stroke-width="1"/>
    <text x="40" y="192" font-size="15" font-weight="bold">Paperi</text>
    <text x="40" y="209" font-family="Consolas, monospace" fill="#4A443F">#E8DCC6</text>
    <text x="40" y="226">hiljaisuus, valo,</text>
    <text x="40" y="242">kumppani</text>

    <rect x="194" y="82" width="140" height="90" fill="#143E66"/>
    <text x="194" y="192" font-size="15" font-weight="bold">Berliininsininen</text>
    <text x="194" y="209" font-family="Consolas, monospace" fill="#4A443F">#143E66</text>
    <text x="194" y="226">maailma, orkesteri,</text>
    <text x="194" y="242">taivas, yö</text>

    <rect x="348" y="82" width="140" height="90" fill="#F5461A"/>
    <text x="348" y="192" font-size="15" font-weight="bold">Sinooperi</text>
    <text x="348" y="209" font-family="Consolas, monospace" fill="#4A443F">#F5461A</text>
    <text x="348" y="226">sankari</text>
    <text x="348" y="242">(sinooperinpunainen)</text>

    <rect x="502" y="82" width="140" height="90" fill="#1F1A18"/>
    <text x="502" y="192" font-size="15" font-weight="bold">Musta</text>
    <text x="502" y="209" font-family="Consolas, monospace" fill="#4A443F">#1F1A18</text>
    <text x="502" y="226">vastustajat,</text>
    <text x="502" y="242">varjot, puupiirros</text>
  </g>

  <!-- Erikoisvärit -->
  <text x="700" y="72" font-size="13" fill="#1F1A18">Erikoisvärit – säästetään rakenteen käännekohtiin</text>
  <g font-size="12" fill="#1F1A18">
    <rect x="700" y="82" width="140" height="90" fill="url(#gold)"/>
    <text x="700" y="192" font-size="15" font-weight="bold">Kulta</text>
    <text x="700" y="209" font-family="Consolas, monospace" fill="#4A443F">#C9A24D</text>
    <text x="700" y="226">täyttymys: kertaus</text>
    <text x="700" y="242">ja loppusointu</text>

    <rect x="854" y="82" width="140" height="90" fill="#8E2457"/>
    <text x="854" y="192" font-size="15" font-weight="bold">Purppura</text>
    <text x="854" y="209" font-family="Consolas, monospace" fill="#4A443F">#8E2457</text>
    <text x="854" y="226">yhteys: rakkausduetto</text>
    <text x="854" y="242">ja loppuduetto</text>

    <rect x="1008" y="82" width="140" height="90" fill="#5F8566"/>
    <text x="1008" y="192" font-size="15" font-weight="bold">Viherä maa</text>
    <text x="1008" y="209" font-family="Consolas, monospace" fill="#4A443F">#5F8566</text>
    <text x="1008" y="226">rauha: pastoraalista</text>
    <text x="1008" y="242">loppuun</text>
  </g>

  <!-- Väripartituuri -->
  <text x="40" y="276" fill="#1F1A18"><tspan font-size="15" font-weight="bold">Väripartituuri</tspan><tspan font-size="12"> – kestot arvioitu LP:n voimakkuuskäyrästä, tarkentuvat merkinnöistä</tspan></text>
  <text x="200" y="294" font-size="11" font-style="italic" fill="#1F1A18">A-puoli</text>
  <text x="671.25" y="294" font-size="11" font-style="italic" fill="#1F1A18">B-puoli</text>
  <line x1="666.25" y1="298" x2="666.25" y2="548" stroke="#1F1A18" stroke-width="0.8" stroke-dasharray="3 3"/>

  <g font-size="13" fill="#1F1A18">
    <text x="40" y="320">Jakso</text>
    <text x="40" y="357">Tausta</text>
    <text x="40" y="389">Sankari</text>
    <text x="40" y="419">Kumppani</text>
    <text x="40" y="449">Vastustajat</text>
    <text x="40" y="479">Kulta</text>
    <text x="40" y="509">Purppura</text>
    <text x="40" y="539">Vihreä</text>
  </g>

  <!-- Jaksot -->
  <g fill="none" stroke="#1F1A18" stroke-width="0.8">
    <rect x="200" y="300" width="90" height="30"/>
    <rect x="290" y="300" width="67.5" height="30"/>
    <rect x="357.5" y="300" width="303.75" height="30"/>
    <rect x="671.25" y="300" width="110.25" height="30"/>
    <rect x="781.5" y="300" width="49.5" height="30"/>
    <rect x="831" y="300" width="108" height="30"/>
    <rect x="939" y="300" width="219.4" height="30"/>
  </g>
  <g font-size="13" fill="#1F1A18" text-anchor="middle">
    <text x="245" y="320">1</text>
    <text x="323.75" y="320">2</text>
    <text x="509.4" y="320">3</text>
    <text x="726.4" y="320">4</text>
    <text x="806.25" y="320">K</text>
    <text x="885" y="320">5</text>
    <text x="1048.7" y="320">6</text>
  </g>

  <!-- Tausta -->
  <rect x="200" y="340" width="90" height="24" fill="url(#g-held)"/>
  <rect x="290" y="340" width="67.5" height="24" fill="#9A8B76"/>
  <rect x="357.5" y="340" width="303.75" height="24" fill="url(#g-gef)"/>
  <rect x="671.25" y="340" width="110.25" height="24" fill="url(#g-wal)"/>
  <rect x="781.5" y="340" width="49.5" height="24" fill="url(#g-rep)"/>
  <rect x="831" y="340" width="108" height="24" fill="url(#g-fri)"/>
  <rect x="939" y="340" width="219.4" height="24" fill="url(#g-wel)"/>

  <!-- Sankari -->
  <g fill="#F5461A">
    <rect x="200" y="374" width="90" height="20"/>
    <rect x="290" y="374" width="50.6" height="20" opacity="0.4"/>
    <rect x="340.6" y="374" width="16.9" height="20"/>
    <rect x="357.5" y="374" width="303.75" height="20"/>
    <rect x="671.25" y="374" width="159.75" height="20"/>
    <rect x="831" y="374" width="108" height="20" opacity="0.4"/>
    <rect x="939" y="374" width="219.4" height="20"/>
  </g>

  <!-- Kumppani -->
  <g fill="#FFFCF4" stroke="#143E66" stroke-width="1">
    <rect x="357.5" y="404" width="303.75" height="20"/>
    <rect x="671.25" y="404" width="267.75" height="20" stroke-dasharray="4 3"/>
    <rect x="939" y="404" width="131.6" height="20" stroke-dasharray="4 3"/>
    <rect x="1070.6" y="404" width="87.8" height="20"/>
  </g>

  <!-- Vastustajat -->
  <g fill="#1F1A18">
    <rect x="290" y="434" width="67.5" height="20"/>
    <rect x="637" y="434" width="24.25" height="20" opacity="0.45"/>
    <rect x="671.25" y="434" width="110.25" height="20"/>
    <rect x="944" y="434" width="7" height="20" opacity="0.8"/>
    <rect x="956" y="434" width="7" height="20" opacity="0.8"/>
  </g>

  <!-- Erikoisvärit -->
  <rect x="781.5" y="464" width="49.5" height="20" fill="url(#gold)"/>
  <rect x="1150" y="464" width="8.4" height="20" fill="url(#gold)"/>
  <rect x="545" y="494" width="30" height="20" fill="#8E2457"/>
  <rect x="1125" y="494" width="33.4" height="20" fill="#8E2457"/>
  <rect x="994" y="524" width="164.4" height="20" fill="#5F8566"/>

  <!-- Selitteet -->
  <g font-size="12" fill="#1F1A18">
    <text x="40" y="580">1 Sankari · 2 Vastustajat · 3 Kumppani ja rakkausduetto · 4 Taistelu (kehittely) · K Kertaus · 5 Rauhantyöt · 6 Pako maailmasta ja täyttymys</text>
    <text x="40" y="600">Täysi palkki = pääosassa · haalea tai katkoviiva = taustalla · erikoisvärit vain merkityissä kohdissa</text>
    <text x="40" y="620">Kumppani on paperia: kun hän soi, tausta ei ole koskaan paperinvaalea.</text>
  </g>
</svg>
